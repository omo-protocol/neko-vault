[profile.default]
via_ir = true
optimizer = true
# Tuned to keep MultiLegController + PtLoopController under EIP-170 (24576 bytes). Higher values
# produce more gas-efficient runtime but push the cross-venue controllers over the deploy limit.
optimizer_runs = 200
bytecode_hash = "none"
evm_version = "cancun"
dynamic_test_linking = true

[profile.default.fmt]
wrap_comments = true

[profile.no_via_ir]
via_ir = false

[fuzz]
runs = 2048

[rpc_endpoints]
ritual = "https://rpc.ritualfoundation.org"
base_sepolia = "https://sepolia.base.org"
base_mainnet = "https://mainnet.base.org"
arbitrum = "${ARBITRUM_RPC_URL}"
